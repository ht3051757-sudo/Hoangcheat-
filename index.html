<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    color:white;
    background:#02020b;
}

body{
    overflow-x:hidden;
}

/* ===== GALAXY ===== */

.galaxy{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;
    background:
      radial-gradient(circle at 50% 10%,#43118a 0,transparent 25%),
      radial-gradient(circle at 10% 70%,#092d83 0,transparent 30%),
      radial-gradient(circle at 90% 70%,#6d0a83 0,transparent 28%),
      #02020b;
}

.galaxy:before,
.galaxy:after{
    content:"";
    position:absolute;
    inset:-100px;
    background-image:
      radial-gradient(circle,#fff 1px,transparent 1.5px),
      radial-gradient(circle,#8ec5ff 1px,transparent 1.5px),
      radial-gradient(circle,#e895ff 1px,transparent 1.5px);
    background-size:80px 80px,135px 135px,200px 200px;
    animation:stars 18s linear infinite;
    opacity:.7;
}

.galaxy:after{
    animation:stars2 30s linear infinite;
    opacity:.3;
}

@keyframes stars{
    from{transform:translateY(0)}
    to{transform:translateY(150px)}
}

@keyframes stars2{
    from{transform:translate(0,0)}
    to{transform:translate(-80px,130px)}
}

/* ===== SAO BĂNG ===== */

.meteor{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:white;
    box-shadow:
      0 0 8px white,
      0 0 20px #50aaff,
      0 0 40px #c44cff;
    transform:rotate(-45deg);
    animation:meteor 4s linear infinite;
}

.meteor:after{
    content:"";
    position:absolute;
    right:2px;
    top:1px;
    width:180px;
    height:3px;
    background:linear-gradient(
      90deg,
      white,
      #629aff,
      transparent
    );
}

.m1{top:10%;left:105%}
.m2{top:35%;left:110%;animation-delay:2s}
.m3{top:55%;left:100%;animation-delay:4s}
.m4{top:20%;left:85%;animation-delay:6s}

@keyframes meteor{
    0%{
        transform:translate(0,0) rotate(-45deg);
        opacity:0;
    }
    8%{opacity:1}
    65%{opacity:1}
    100%{
        transform:translate(-750px,750px) rotate(-45deg);
        opacity:0;
    }
}
