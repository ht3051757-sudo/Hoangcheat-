<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEY CHEATER - HoangCheat</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    color:#222;
}

.header{
    height:90px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    padding:0 36px;
}

.logo{
    font-size:25px;
    font-weight:800;
    color:#18203b;
}

.container{
    max-width:700px;
    margin:78px auto;
    padding:0 18px;
}

.card{
    background:#fff;
    border:1px solid #e3e6ed;
    border-radius:12px;
    overflow:hidden;
}

.profile{
    height:60px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0 25px;
    color:#666;
    font-weight:700;
}

.content{
    padding:38px 36px;
}

.info{
    height:80px;
    border:2px solid #e3e5eb;
    border-radius:10px;
    display:flex;
    align-items:center;
    padding:0 28px;
    margin-bottom:22px;
    color:#5276c9;
    font-size:25px;
    font-weight:700;
}

.icon{
    width:45px;
    font-size:25px;
}

.free{
    height:62px;
    border:2px solid #58d3ae;
    border-radius:10px;
    display:flex;
    align-items:center;
    padding:0 28px;
    color:#2eb98d;
    font-size:24px;
    font-weight:700;
    margin-bottom:38px;
}

.generate{
    width:100%;
    height:74px;
    border:0;
    border-radius:10px;
    background:#ef493e;
    color:white;
    font-size:24px;
    font-weight:800;
    cursor:pointer;
}

.warning{
    text-align:center;
    color:#e74c43;
    font-weight:700;
    margin-top:25px;
}

.key-box{
    display:none;
    margin-top:20px;
    padding:18px;
    border-radius:8px;
    background:#f0fdf8;
    border:1px solid #58d3ae;
    text-align:center;
    font-weight:bold;
}

.key-box a{
    display:block;
    margin-top:10px;
    color:#5276c9;
    word-break:break-all;
}

@media(max-width:600px){
    .info{font-size:21px}
    .free{font-size:20px}
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">KEY CHEATER</div>
</header>

<main class="container">
<div class="card">

    <div class="profile">
        👤 <span>BY: HoangCheat</span>
    </div>

    <div class="content">

        <div class="info">
            <div class="icon">🎮</div>
            No Root - 1
        </div>

        <div class="info">
            <div class="icon">◷</div>
            Thời gian: 24 Giờ
        </div>

        <div class="info">
            <div class="icon">📱</div>
            Max Devices: 1 Máy
        </div>

        <div class="free">
            💎 &nbsp; FREE KEY SYSTEM
        </div>

        <button class="generate" onclick="generateKey()">
            🚪 &nbsp; Generate Key
        </button>

        <div class="warning">
            ⚠️ &nbsp; Yêu cầu vượt link thủ công tối thiểu 130 giây
        </div>

        <div id="keyBox" class="key-box">
            🔗 Link lấy Key:
            <a href="https://ontops.link/-P_I8xM" target="_blank">
                https://ontops.link/-P_I8xM
            </a>
        </div>

    </div>
</div>
</main>

<script>
function generateKey(){
    document.getElementById("keyBox").style.display="block";
}
</script>

</body>
  </html>
